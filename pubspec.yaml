name: saptah_manager
description: सप्ताह व्यवस्थापक (Saptah Manager)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.3.0
  firebase_messaging: ^15.1.0

  # UI / utilities
  cached_network_image: ^3.4.0
  badges: ^3.1.2
  flutter_spinkit: ^5.2.1
  image_picker: ^1.1.2
  intl: ^0.19.0

  # Export/share
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  csv: ^6.0.0
  pdf: ^3.11.1
  printing: ^5.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

